services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-dynamic_forms}
      MYSQL_USER: ${DB_USER:-dynamic_forms}
      MYSQL_PASSWORD: ${DB_PASS:-dynamic_forms_password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_password_change_me}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      APP_NAME: ${APP_NAME:-Dynamic Forms}
      APP_ENV: ${APP_ENV:-production}
      APP_URL: ${APP_URL:-http://localhost:8080}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-dynamic_forms}
      DB_USER: ${DB_USER:-dynamic_forms}
      DB_PASS: ${DB_PASS:-dynamic_forms_password}
      DB_PERSISTENT: "false"
      SESSION_NAME: ${SESSION_NAME:-dynamic_forms_session}
      SESSION_LIFETIME: ${SESSION_LIFETIME:-7200}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-5242880}
      MAX_COVER_SIZE: ${MAX_COVER_SIZE:-2097152}
      MAX_QUESTIONS_PER_FORM: ${MAX_QUESTIONS_PER_FORM:-100}
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - app_storage:/var/www/html/storage

volumes:
  mysql_data:
  app_storage:
